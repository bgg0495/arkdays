<!doctype html>
<html lang="ko">
<head>
<!-- 금일방주 Arkdays · 단일 파일 빌드 2026-10-20 · 이 파일 하나로 동작합니다(외부 요청 없음). 저장은 브라우저 localStorage(tr1.*). -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>금일방주 Arkdays — 테라에서 한 생</title>
<style>
:root {
  --bg: #0e1116;
  --bg-2: #11151b;
  --panel: #151a21;
  --panel-2: #1a2029;
  --panel-3: #222a35;
  --line: #262e39;
  --line-2: #38424f;
  --text: #d6dbe3;
  --text-2: #a9b2be;
  --muted: #6e7989;
  --accent: #f28c28;
  --accent-soft: rgba(242, 140, 40, 0.13);
  --accent-dim: rgba(242, 140, 40, 0.5);
  --accent2: #3fc1bb;
  --accent2-soft: rgba(63, 193, 187, 0.12);
  --bad: #e2695d;
  --bad-soft: rgba(226, 105, 93, 0.1);
  --sans: "Pretendard", "Noto Sans KR", "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", sans-serif;
  
  --mono: "Cascadia Mono", "JetBrains Mono", Consolas, "SF Mono", Menlo, "Roboto Mono", "Pretendard", "Noto Sans KR", "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", monospace;
  --cut: 10px;
  --fc: var(--line);
  --grid: rgba(255, 255, 255, 0.022);
  --hatch: rgba(255, 255, 255, 0.025);
  --bar-bg: rgba(14, 17, 22, 0.94);
  color-scheme: dark;
}

:root[data-theme="light"],
:root:not([data-theme="dark"]):not([data-theme="light"]).sys-light {
  --bg: #f1efe9;
  --bg-2: #ebe8e1;
  --panel: #fbfaf7;
  --panel-2: #f3f1ec;
  --panel-3: #e7e4dc;
  --line: #d6d2c8;
  --line-2: #b9b4a7;
  --text: #1c2027;
  --text-2: #3d434d;
  --muted: #747b88;
  --accent: #d4701a;
  --accent-soft: rgba(212, 112, 26, 0.12);
  --accent-dim: rgba(212, 112, 26, 0.5);
  --accent2: #1a8f8a;
  --accent2-soft: rgba(26, 143, 138, 0.12);
  --bad: #c2463b;
  --bad-soft: rgba(194, 70, 59, 0.1);
  --grid: rgba(0, 0, 0, 0.035);
  --hatch: rgba(0, 0, 0, 0.045);
  --bar-bg: rgba(241, 239, 233, 0.94);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { background: var(--bg); }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14.5px;
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 48px 48px;
}
#app { position: relative; z-index: 1; }
::selection { background: var(--accent-soft); color: var(--text); }
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 0; }

h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
h1 { font-size: 2rem; }
p { margin: 0.5em 0; }
a { color: var(--accent2); }
code { font-family: var(--mono); font-size: 0.9em; background: var(--panel-3); padding: 0 0.3em; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.85em; }
.stamp-text { color: var(--accent); font-weight: 600; }
.dots { letter-spacing: 0.12em; color: var(--accent); }
.footnote { color: var(--muted); font-size: 0.72rem; line-height: 1.45; margin-top: 0.25em; }
[hidden] { display: none !important; }

.en { display: block; font-family: var(--mono); font-weight: 500; font-size: 0.6rem; line-height: 1.2; letter-spacing: 0.24em; text-transform: uppercase; color: var(--accent); }
.h-small { margin: 0 0 0.8rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--line); font-size: 0.95rem; font-weight: 600; color: var(--text); }
.h-small .en { margin-bottom: 0.3em; }
.h-small .muted { font-weight: 400; font-size: 0.74rem; margin-left: 0.35em; }
.lbl { font-size: 0.88rem; font-weight: 600; color: var(--text); }
.lbl .en { margin-bottom: 0.2em; }

.card, .sheet, .modal, .btn.primary {
  position: relative;
  clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, 0 100%);
}
.card::after, .sheet::after, .modal::after, .btn.primary::after {
  content: ""; position: absolute; top: 0; right: 0; z-index: 3; width: var(--cut); height: var(--cut); pointer-events: none;
  background: linear-gradient(to top right, transparent calc(50% - 0.5px), var(--fc) calc(50% - 0.5px), var(--fc) calc(50% + 1px), transparent calc(50% + 1px));
}

.screen { min-height: 100vh; }
.sheet { max-width: 720px; margin: 40px auto; padding: 36px 44px; background: var(--panel); border: 1px solid var(--line); --cut: 14px; }
.sheet.start { max-width: 600px; margin: 9vh auto 40px; }
.doc-head { position: relative; margin-bottom: 1.4rem; }
.doc-head.row { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; padding-bottom: 1rem; border-bottom: 1px solid var(--line); }
.doc-head .en { margin-bottom: 0.45em; }
.doc-kind { font-size: 1rem; font-weight: 600; letter-spacing: 0.12em; color: var(--text); line-height: 1.2; }
.doc-no { font-size: 0.78rem; color: var(--muted); letter-spacing: 0.06em; }
.doc-right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.5rem; }
.doc-foot { border-top: 1px solid var(--line); margin-top: 2rem; padding-top: 0.9rem; font-size: 0.72rem; color: var(--muted); letter-spacing: 0.02em; }
.person-name { font-size: 2.1rem; font-weight: 700; margin: 0.5em 0 0.15em; letter-spacing: -0.015em; line-height: 1.2; overflow-wrap: anywhere; }
.doc-meta { margin: 0 0 1rem; font-size: 0.84rem; color: var(--text-2); letter-spacing: 0.01em; }
.lead { font-size: 1rem; line-height: 1.8; color: var(--text); }
.stamp { align-self: flex-start; font-family: var(--mono); font-size: 0.68rem; font-weight: 600; color: var(--accent); border: 1px solid var(--accent); padding: 0.35em 0.8em; letter-spacing: 0.3em; white-space: nowrap; }
.stamp-dead { color: var(--text-2); border-color: var(--line-2); }
.blurb { background: var(--panel-2); padding: 0.7em 1em; border-left: 2px solid var(--accent2); margin: 1.2rem 0 0.4rem; font-size: 0.9rem; color: var(--text-2); }
.blurb b { color: var(--text); margin-right: 0.2em; }
.sec { margin-top: 1.8rem; }

.rec { display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem 1.6rem; margin: 1.2rem 0 0; padding: 1.1rem 0 0.4rem; border-top: 1px solid var(--line); }
.rec .f { min-width: 0; padding-bottom: 0.55rem; border-bottom: 1px solid var(--line); }
.rec .f.w { grid-column: 1 / -1; }
.rec dt { font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.14em; color: var(--muted); margin-bottom: 0.3em; }
.rec dd { margin: 0; font-size: 1rem; color: var(--text); line-height: 1.45; overflow-wrap: anywhere; }
.rec dd .dots { font-size: 0.9em; }
.rec-sub { display: inline-block; font-size: 0.76rem; color: var(--muted); margin-left: 0.15em; }

.kv { width: 100%; border-collapse: collapse; margin: 0.9rem 0; }
.kv th, .kv td { text-align: left; padding: 0.45em 0.4em; border-bottom: 1px solid var(--line); vertical-align: top; }
.kv th { width: 8.5em; font-weight: 500; font-size: 0.74rem; letter-spacing: 0.04em; color: var(--muted); white-space: nowrap; padding-top: 0.65em; }
.kv td { font-size: 0.9rem; }
.kv.small th, .kv.small td { font-size: 0.8rem; padding: 0.3em 0.3em; }
.kv.small th { width: 6.5em; font-size: 0.68rem; padding-top: 0.5em; }

.pixel-slot {
  position: relative; height: 120px; margin: 1rem 0; border: 1px solid var(--line-2);
  display: flex; align-items: center; justify-content: center; color: var(--muted); font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.24em;
  background: repeating-linear-gradient(135deg, transparent 0 7px, var(--hatch) 7px 8px);
}
.pixel-slot::before, .pixel-slot::after { content: ""; position: absolute; width: 9px; height: 9px; border: 1px solid var(--accent-dim); }
.pixel-slot::before { top: 4px; left: 4px; border-right: 0; border-bottom: 0; }
.pixel-slot::after { bottom: 4px; right: 4px; border-left: 0; border-top: 0; }
.pixel-slot.small { width: 76px; height: 96px; margin: 0; flex: 0 0 auto; font-size: 0.55rem; letter-spacing: 0.1em; text-align: center; }

.btn {
  font: inherit; font-size: 0.85rem; cursor: pointer; border: 1px solid var(--line-2); background: transparent; color: var(--text-2);
  padding: 0.42em 0.95em; border-radius: 0; line-height: 1.3; letter-spacing: 0.02em;
  transition: border-color 120ms, color 120ms, background-color 120ms;
}
.btn:hover { border-color: var(--text-2); color: var(--text); }
.btn:focus-visible { outline: 1px solid var(--accent2); outline-offset: 2px; }
.btn:disabled { opacity: 0.35; cursor: default; }
.btn:disabled:hover { border-color: var(--line-2); color: var(--text-2); }
.btn.primary { border-color: var(--accent); color: var(--accent); font-weight: 600; letter-spacing: 0.08em; --cut: 8px; --fc: var(--accent); }
.btn.primary:hover { background: var(--accent-soft); }
.btn.big { font-size: 1rem; padding: 0.8em 2.4em; }
.btn.ghost { border-color: transparent; color: var(--muted); }
.btn.ghost:hover { border-color: var(--line-2); color: var(--text); }
.btn.small { font-size: 0.8rem; padding: 0.32em 0.75em; }
.btn.tiny { font-size: 0.72rem; padding: 0.32em 0.62em; letter-spacing: 0.04em; }
.btn.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.start-actions { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; margin: 1.6rem 0 0.4rem; }

.start .doc-head { margin-bottom: 1.8rem; padding-bottom: 1.4rem; border-bottom: 1px solid var(--line); }
.start .doc-title { font-size: 3.4rem; font-weight: 700; letter-spacing: 0.06em; line-height: 1.05; margin: 0; }
.doc-title-en { display: block; font-family: var(--mono); font-weight: 500; font-size: 0.72rem; letter-spacing: 0.55em; text-transform: uppercase; color: var(--accent); margin: 0.7em 0 0 0.15em; }
.doc-sub { color: var(--text-2); margin: 1.1rem 0 0; font-size: 0.92rem; }
.tagline { display: block; font-size: 1.35rem; font-weight: 500; color: var(--text); letter-spacing: -0.01em; margin-bottom: 0.25em; }
.share-chart { margin: 1.4rem 0; }
.share-bar { display: flex; height: 6px; overflow: hidden; background: var(--panel-3); }
.share-seg { display: block; flex: 0 0 auto; }
.share-legend { list-style: none; padding: 0; margin: 0.9rem 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 0 1.6rem; font-size: 0.82rem; }
.share-legend li { display: grid; grid-template-columns: 8px minmax(5.5em, auto) 1fr auto; align-items: center; gap: 0.6em; padding: 0.38em 0; border-bottom: 1px solid var(--line); }
.share-name { color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.share-track { height: 2px; background: var(--panel-3); }
.share-fill { display: block; height: 100%; }
.share-pct { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--text); font-size: 0.78rem; }
.swatch { display: inline-block; width: 8px; height: 8px; }
[data-i="0"] .swatch, [data-i="0"] .share-fill, .share-seg[data-i="0"] { background: #f28c28; }
[data-i="1"] .swatch, [data-i="1"] .share-fill, .share-seg[data-i="1"] { background: #3fc1bb; }
[data-i="2"] .swatch, [data-i="2"] .share-fill, .share-seg[data-i="2"] { background: #d6dbe3; }
[data-i="3"] .swatch, [data-i="3"] .share-fill, .share-seg[data-i="3"] { background: #8aa0bd; }
[data-i="4"] .swatch, [data-i="4"] .share-fill, .share-seg[data-i="4"] { background: #e3b25b; }
[data-i="5"] .swatch, [data-i="5"] .share-fill, .share-seg[data-i="5"] { background: #5f9e9a; }
[data-i="6"] .swatch, [data-i="6"] .share-fill, .share-seg[data-i="6"] { background: #a7846a; }
[data-i="7"] .swatch, [data-i="7"] .share-fill, .share-seg[data-i="7"] { background: #6e7989; }
[data-i="8"] .swatch, [data-i="8"] .share-fill, .share-seg[data-i="8"] { background: #38424f; }
.past { margin-top: 1.6rem; }
.past ul { list-style: none; padding: 0; margin: 0; font-size: 0.8rem; color: var(--text-2); }
.past li { padding: 0.35em 0; border-bottom: 1px solid var(--line); }
.past li .mono { color: var(--muted); font-size: 0.72rem; margin-right: 0.4em; }
.boot-error { max-width: 640px; margin: 48px auto; padding: 24px; }
.noscript { max-width: 640px; margin: 48px auto; padding: 24px; }

.life-bar {
  position: sticky; top: 0; z-index: 20; background: var(--bar-bg); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.4rem 1rem; padding: 0.5rem 1.2rem 0.6rem;
}
.bar-left { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
.bar-title { font-family: var(--sans); font-weight: 700; font-size: 0.78rem; letter-spacing: 0.22em; color: var(--accent); padding-right: 1rem; border-right: 1px solid var(--line-2); line-height: 1; }
.bar-age { display: inline-flex; align-items: baseline; gap: 0.25em; font-size: 0.8rem; color: var(--muted); }
.bar-age .en { display: inline; margin-right: 0.4em; font-size: 0.56rem; }
.bar-age b { font-family: var(--mono); font-weight: 500; font-size: 1.7rem; line-height: 1; color: var(--text); }
.bar-year { font-size: 0.78rem; color: var(--text-2); letter-spacing: 0.04em; }
.bar-name { font-weight: 600; font-size: 0.92rem; }
.bar-pace { font-family: var(--mono); font-size: 0.68rem; color: var(--muted); letter-spacing: 0.04em; }
.bar-right { display: flex; align-items: center; gap: 0.35rem; flex-wrap: wrap; }
.speed-group { display: inline-flex; border: 1px solid var(--line-2); }
.speed-group .btn { border: 0; border-right: 1px solid var(--line-2); font-family: var(--mono); }
.speed-group .btn:last-child { border-right: 0; }
.speed-group .btn.on { background: var(--accent-soft); }
.bar-prog { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--line); }
.bar-prog-fill { height: 100%; background: var(--accent2); transition: width 80ms linear; }

.life-grid { display: grid; grid-template-columns: 300px minmax(0, 1fr) 300px; gap: 12px; padding: 16px; max-width: 1440px; margin: 0 auto; }
.col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); padding: 14px 16px; }

.id-card { padding: 0; overflow: hidden; }
.id-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 0.6rem; padding: 0.7rem 0.95rem 0.55rem; border-bottom: 1px solid var(--line); }
.id-no { font-size: 0.68rem; color: var(--muted); letter-spacing: 0.08em; padding-bottom: 0.15em; }
.id-body { display: flex; gap: 0.9rem; padding: 0.85rem 0.95rem 0.6rem; }
.id-main { min-width: 0; flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 0.2rem; }
.id-name { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; overflow-wrap: anywhere; }
.id-sub { font-size: 0.82rem; color: var(--text-2); }
.id-status { font-size: 0.78rem; color: var(--accent2); letter-spacing: 0.02em; }
.id-kv { display: grid; grid-template-columns: 1fr 1fr; gap: 0.55rem 0.8rem; margin: 0; padding: 0.4rem 0.95rem 0.85rem; }
.id-kv .f { min-width: 0; }
.id-kv .f.w { grid-column: 1 / -1; }
.id-kv dt { font-family: var(--mono); font-size: 0.58rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.15em; }
.id-kv dd { margin: 0; font-size: 0.86rem; color: var(--text); line-height: 1.4; overflow-wrap: anywhere; }
.mrz { background: var(--bg-2); border-top: 1px solid var(--line); padding: 0.45rem 0.95rem; font-size: 0.64rem; letter-spacing: 0.12em; color: var(--muted); overflow: hidden; white-space: nowrap; line-height: 1.5; }

.stat { display: grid; grid-template-columns: 2.6em 1fr 2.8em; align-items: center; gap: 0.7em; margin: 0.55em 0; font-size: 0.78rem; }
.stat-k { color: var(--muted); letter-spacing: 0.04em; }
.stat-bar { height: 4px; background: var(--panel-3); overflow: hidden; }
.stat-fill { display: block; height: 100%; transition: width 300ms ease; }
.s-hl { background: var(--accent2); } .s-h { background: var(--accent); } .s-sm { background: #c3ccd8; } .s-so { background: #7f98b8; } .s-ori { background: var(--bad); }
.stat-v { text-align: right; font-size: 0.86rem; color: var(--text); }

.money-main { display: flex; align-items: baseline; gap: 0.6em; margin-bottom: 0.3rem; }
.money-v { font-size: 1.4rem; font-weight: 500; letter-spacing: -0.01em; }
.money-v.neg { color: var(--bad); }
.money-row { display: flex; justify-content: space-between; gap: 0.8em; font-size: 0.82rem; padding: 0.3em 0; border-bottom: 1px solid var(--line); }
.money-row > span:first-child { color: var(--muted); white-space: nowrap; }
.money-row > span:last-child { text-align: right; }
.fam { list-style: none; padding: 0; margin: 0; font-size: 0.84rem; }
.fam li { display: flex; gap: 0.6em; padding: 0.3em 0; border-bottom: 1px solid var(--line); }
.fam .who { flex: 0 0 3.6em; font-size: 0.72rem; color: var(--muted); letter-spacing: 0.04em; padding-top: 0.15em; }
.fam .gone { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-2); }

.chips { display: flex; flex-wrap: wrap; gap: 0.45rem; }
.chip { font: inherit; font-size: 0.82rem; cursor: pointer; border: 1px solid var(--line-2); background: transparent; color: var(--text-2); border-radius: 0; padding: 0.45em 0.9em; display: inline-flex; flex-direction: column; align-items: flex-start; line-height: 1.3; min-width: 6.2em; transition: border-color 120ms, color 120ms, background-color 120ms; }
.chip:hover { border-color: var(--text-2); color: var(--text); }
.chip .chip-hint { font-family: var(--sans); font-size: 0.66rem; color: var(--muted); letter-spacing: 0.02em; margin-top: 0.15em; }
.chip.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.chip.on .chip-hint { color: var(--accent); opacity: 0.8; }

.log-card { flex: 1; }
.log { max-height: calc(100vh - 230px); overflow-y: auto; padding-right: 4px; }
.log-line { display: grid; grid-template-columns: 2.8em minmax(0, 1fr) auto; column-gap: 0.7em; align-items: baseline; padding: 0.42em 0.2em 0.42em 0.6em; border-bottom: 1px solid var(--line); border-left: 2px solid transparent; font-size: 0.88rem; }
.log-line:first-child { animation: fade-in 400ms ease; }
@keyframes fade-in { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
.log-a { font-size: 0.7rem; color: var(--muted); text-align: right; letter-spacing: 0.02em; }
.log-t { color: var(--text); }
.log-fx { font-family: var(--mono); font-size: 0.68rem; color: var(--muted); max-width: 13em; text-align: right; line-height: 1.4; }
.log-f { grid-column: 2 / -1; font-size: 0.7rem; color: var(--muted); opacity: 0.8; line-height: 1.45; margin-top: 0.15em; }
.k-big { border-left-color: var(--accent2); } .k-big .log-t { font-weight: 600; } .k-big .log-a { color: var(--accent2); }
.k-bad { border-left-color: var(--accent); } .k-bad .log-a { color: var(--accent); }
.k-warm { border-left-color: var(--accent-dim); }
.k-loss { border-left-color: var(--bad); } .k-loss .log-t { color: var(--bad); } .k-loss .log-a { color: var(--bad); }
.k-note .log-t { color: var(--text-2); }
.k-dec { border-left-color: var(--line-2); background: var(--panel-2); }
.k-death { border-left-color: var(--bad); background: var(--bad-soft); } .k-death .log-t { font-weight: 700; } .k-death .log-a { color: var(--bad); }

.map { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
.mc { display: block; aspect-ratio: 1; min-height: 10px; background: var(--panel-3); border: 1px solid transparent; }
